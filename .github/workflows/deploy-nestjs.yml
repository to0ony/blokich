name: Deploy NestJS

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Oba deploya rade na istom git repou na serveru – ne smiju istovremeno.
concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy NestJS
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            # Non-interactive SSH ne čita ~/.bashrc – učitaj nvm ručno, inače
            # se koristi sistemski Node 12 s kojim build ne radi.
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then . "$NVM_DIR/nvm.sh"; fi
            echo "Node $(node -v) ($(command -v node))"
            NODE_MAJOR=$(node -p 'process.versions.node.split(".")[0]')
            if [ "$NODE_MAJOR" -lt 18 ]; then
              echo "Node $(node -v) je prestar (treba >= 18). Prekidam deploy."
              exit 1
            fi
            cd ~/blokich
            # Lokalne izmjene na serveru (npr. lock file) ne smiju blokirati deploy.
            # .env je gitignoran pa ostaje netaknut.
            git fetch origin main
            git reset --hard origin/main
            echo "Deploying $(git log --oneline -1)"
            cd service/blokich
            npm ci
            npm run build
            pm2 restart blokich --update-env
