<div class="vz-app">
  <p-menu #userMenu [model]="menu" [popup]="true" appendTo="body" />

  <!-- Gornja traka -->
  <header class="vz-top">
    <div class="vz-top-inner">
      <img src="assets/blokich_logo.png" alt="Blokich" class="vz-logo" />

      <button type="button" class="vz-user" (click)="userMenu.toggle($event)">
        <span class="vz-user-text">
          <span class="vz-user-name">
            {{ imePrezime }} <span class="vz-user-num">{{ sluzbeniBroj }}</span>
          </span>
          <span class="vz-user-tel" *ngIf="telefoni.length">
            {{ telefoni.join(" ili ") }}
          </span>
        </span>
        <span class="vz-avatar">{{ inicijali }}</span>
      </button>
    </div>

    <!-- Na širem ekranu navigacija je ovdje, na mobitelu dolje -->
    <nav class="vz-tabs" aria-label="Glavna navigacija">
      <button
        *ngFor="let n of nav"
        type="button"
        class="vz-tab"
        [class.is-active]="aktivan(n.view)"
        [attr.aria-current]="aktivan(n.view) ? 'page' : null"
        (click)="promijeniView(n.view)"
      >
        <i [class]="n.icon"></i>
        <span>{{ n.label }}</span>
      </button>
    </nav>
  </header>

  <main class="vz-main">
    <app-raspored
      *ngIf="view === 'raspored'"
      [data]="podaci"
      [loading]="loading"
      [error]="error"
      [tjedan]="tjedan"
      [naredniDostupan]="naredniDostupan"
      (tjedanChange)="promijeniTjedan($event)"
      (retry)="ucitaj()"
      (otvoriKalendar)="promijeniView('kalendar')"
    />

    <app-kalendar *ngIf="view === 'kalendar'" (natrag)="promijeniView('raspored')" />

    <app-danas
      *ngIf="view === 'danas'"
      [dan]="danas"
      [rasporedLoading]="danasLoading"
    />

    <app-linije *ngIf="view === 'linije'" [naredniDostupan]="naredniDostupan" />

    <app-sluzbe *ngIf="view === 'sluzbe'" [naredniDostupan]="naredniDostupan" />

    <app-driver-stats *ngIf="view === 'statistika'" />
  </main>

  <!-- Donja navigacija (mobitel) -->
  <nav class="vz-bottom" aria-label="Glavna navigacija">
    <button
      *ngFor="let n of nav"
      type="button"
      class="vz-bottom-item"
      [class.is-active]="aktivan(n.view)"
      [attr.aria-current]="aktivan(n.view) ? 'page' : null"
      (click)="promijeniView(n.view)"
    >
      <i [class]="n.icon"></i>
      <span>{{ n.label }}</span>
    </button>
  </nav>
</div>
