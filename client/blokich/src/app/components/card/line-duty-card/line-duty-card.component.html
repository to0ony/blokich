<div class="ldc-card" [class.is-highlighted]="jePrijavljeni">
  <header class="ldc-header">
    <div class="ldc-identity">
      <h3 class="ldc-name">{{ vozac.ime_prezime }}</h3>
      <div class="ldc-badges">
        <span *ngIf="vozac.sluz_broj" class="ldc-badge">{{ vozac.sluz_broj }}</span>
        <span *ngIf="vozac.linija" class="ldc-line-tag">Linija {{ vozac.linija }}</span>
      </div>
    </div>
    <div class="ldc-actions">
      <a *ngIf="vozac.kontakt_broj" [href]="'tel:' + vozac.kontakt_broj" class="ldc-icon-btn call">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
      </a>
      <a *ngIf="vozac.linija" [href]="'https://triglav.bezdomni.net/public_transport/zet/routes/' + vozac.linija" target="_blank" class="ldc-icon-btn route">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="3"/><path d="M12 21.7C17.3 17 20 13 20 10a8 8 0 1 0-16 0c0 3 2.7 6.9 8 11.7z"/></svg>
      </a>
    </div>
  </header>

  <div class="ldc-info-grid">
    <div class="ldc-info-item text-left">
      <span class="ldc-label">SLUŽBA</span>
      <span class="ldc-value-bold">{{ vozac.br_sl }}</span>
    </div>
    <div class="ldc-info-item text-right">
      <span class="ldc-label">V.R.</span>
      <span class="ldc-value-bold">{{ vozac['V.R'] }}</span>
    </div>
  </div>

  <div class="ldc-timeline">
    <div class="ldc-node">
      <span class="ldc-label">NASTUP</span>
      <span class="ldc-time">{{ vozac.nastup }}</span>
      <span class="ldc-location">{{ vozac.od }}</span>
    </div>
    
    <div class="ldc-connector">
      <div class="ldc-dot start"></div>
      <div class="ldc-line-path"></div>
      <div class="ldc-dot end"></div>
    </div>

    <div class="ldc-node text-right">
      <span class="ldc-label">ZAVRŠETAK</span>
      <span class="ldc-time">{{ vozac.zavrsetak }}</span>
      <span class="ldc-location">{{ vozac.do }}</span>
    </div>
  </div>
</div>
