<div class="line-duty-card" [class.highlight]="jePrijavljeni">
  <div class="header">
    <div class="ime">
      {{ vozac.ime_prezime }}
      <a
        *ngIf="vozac.kontakt_broj"
        class="call-button"
        [href]="'tel:' + vozac.kontakt_broj"
        [attr.aria-label]="'Nazovi ' + vozac.ime_prezime"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            d="M18.6 15.7c-.7-.1-1.3-.4-1.8-.7-.4-.2-.9 0-1.1.4l-.4.9c-1.7-.8-3.6-2.6-4.4-4.4l.9-.4c.4-.2.6-.7.4-1.1-.3-.5-.5-1.1-.7-1.8-.1-.4-.5-.7-.9-.7h-1c-.5 0-1 .4-1 1 0 5.1 4.2 9.3 9.3 9.3.6 0 1-.5 1-1v-1c0-.4-.3-.8-.8-.9Z"
            fill="currentColor"
          />
        </svg>
      </a>
    </div>
    <div class="broj">{{ vozac.sluz_broj }}</div>
    <span class="badge bg-dark">{{ vozac.br_sl }}</span>
  </div>

  <div class="details">
    <div class="vrijeme">{{ vozac.od }} – {{ vozac.do }}</div>

    <div class="info">
      <span>Nastup:</span>
      <span class="badge light">{{ vozac.nastup }}</span>
      <span>➔</span>
      <span>Završetak:</span>
      <span class="badge light">{{ vozac.zavrsetak }}</span>
    </div>

    <div class="line-info" *ngIf="vozac['V.R']">
      <span class="vr-label">Linija:</span>
      <a
        class="badge bg-accent1"
        [href]="
          'https://triglav.bezdomni.net/public_transport/zet/routes/' +
          vozac.linija
        "
        target="_blank"
        rel="noopener noreferrer"
        style="text-decoration: none; color: white"
      >
        {{ vozac.linija }}
      </a>
      <span class="vr-label">V.R:</span>
      <span class="badge bg-accent2">{{ vozac["V.R"] }}</span>
    </div>
  </div>
</div>
