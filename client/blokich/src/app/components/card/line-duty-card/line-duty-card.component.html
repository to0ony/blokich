<div class="line-duty-card" [class.highlight]="jePrijavljeni">
  <div class="card-header">
    <div class="driver-info">
      <div class="driver-name">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 2C13.1 2 14 2.9 14 4C14 5.1 13.1 6 12 6C10.9 6 10 5.1 10 4C10 2.9 10.9 2 12 2ZM21 9V7L15 1H5C3.89 1 3 1.89 3 3V21C3 22.11 3.89 23 5 23H19C20.11 23 21 22.11 21 21V9M19 9H14V4H19V9Z"
            fill="currentColor"
          />
        </svg>
        {{ vozac.ime_prezime }}
        <a
          *ngIf="vozac.kontakt_broj"
          class="call-button"
          [href]="'tel:' + vozac.kontakt_broj"
          [attr.aria-label]="'Nazovi ' + vozac.ime_prezime"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M6.62 10.79c1.44 2.83 3.76 5.15 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"
              fill="currentColor"
            />
          </svg>
        </a>
      </div>
      <div class="driver-details">
        <span class="service-number">{{ vozac.sluz_broj }}</span>
        <span class="badge status-badge">{{ vozac.br_sl }}</span>
      </div>
    </div>
  </div>

  <div class="card-body">
    <div class="time-info">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15l-4-4 1.41-1.41L11 14.17l6.59-6.59L19 9l-8 8z"
          fill="currentColor"
        />
      </svg>
      <span class="time-range">{{ vozac.od }} – {{ vozac.do }}</span>
    </div>

    <div class="shift-info">
      <div class="shift-item">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
            fill="currentColor"
          />
        </svg>
        <span class="label">Nastup:</span>
        <span class="badge time-badge">{{ vozac.nastup }}</span>
      </div>
      <div class="shift-item">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
            fill="currentColor"
          />
        </svg>
        <span class="label">Završetak:</span>
        <span class="badge time-badge">{{ vozac.zavrsetak }}</span>
      </div>
    </div>

    <div class="line-info" *ngIf="vozac['V.R']">
      <div class="line-item">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M4 15l3-3 3 3V4h2v11l3-3 3 3V4h2v11l3-3 3 3V4h2v11l-3-3-3 3-3-3-3 3-3-3-3 3V4H4v11z"
            fill="currentColor"
          />
        </svg>
        <span class="label">Linija:</span>
        <a
          class="badge line-badge"
          [href]="
            'https://triglav.bezdomni.net/public_transport/zet/routes/' +
            vozac.linija
          "
          target="_blank"
          rel="noopener noreferrer"
        >
          {{ vozac.linija }}
        </a>
      </div>
      <div class="line-item">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"
            fill="currentColor"
          />
        </svg>
        <span class="label">V.R:</span>
        <span class="badge vr-badge">{{ vozac["V.R"] }}</span>
      </div>
    </div>
  </div>
</div>
