<div class="line-duty-card" [class.highlight]="jePrijavljeni">
  <div class="ldc-main">
    <div class="ldc-header-row">
      <div class="ldc-name-block">
        <span class="ldc-name">{{ vozac.ime_prezime }}</span>
        <span *ngIf="vozac.linija" class="ldc-line">Linija {{ vozac.linija }}</span>
      </div>
      <div class="ldc-actions">
        <a *ngIf="vozac.kontakt_broj" class="ldc-call" [href]="'tel:' + vozac.kontakt_broj" [attr.aria-label]="'Nazovi ' + vozac.ime_prezime">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.62 10.79c1.44 2.83 3.76 5.15 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" fill="currentColor"/></svg>
        </a>
        <a *ngIf="vozac.linija" class="ldc-link" [href]="'https://triglav.bezdomni.net/public_transport/zet/routes/' + vozac.linija" target="_blank" rel="noopener noreferrer" aria-label="Detalji linije">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="currentColor"/></svg>
        </a>
      </div>
    </div>
    <div class="ldc-details-row">
      <div class="ldc-detail-group">
        <span class="ldc-label">Servisni broj:</span>
        <span class="ldc-value">{{ vozac.sluz_broj }}</span>
      </div>
      <div class="ldc-detail-group">
        <span class="ldc-label">Status:</span>
        <span class="ldc-value">{{ vozac.br_sl }}</span>
      </div>
      <div class="ldc-detail-group">
        <span class="ldc-label">V.R:</span>
        <span class="ldc-value">{{ vozac['V.R'] }}</span>
      </div>
    </div>
    <div class="ldc-times-row">
      <div class="ldc-time-block">
        <span class="ldc-label">Vrijeme:</span>
        <span class="ldc-value">{{ vozac.od }} – {{ vozac.do }}</span>
      </div>
      <div class="ldc-time-block">
        <span class="ldc-label">Nastup:</span>
        <span class="ldc-value">{{ vozac.nastup }}</span>
      </div>
      <div class="ldc-time-block">
        <span class="ldc-label">Završetak:</span>
        <span class="ldc-value">{{ vozac.zavrsetak }}</span>
      </div>
    </div>
  </div>
</div>
