<div class="ldc-card" [ngClass]="[getDayClass(), isToday() ? 'is-today' : '']">
  <div class="ldc-day-indicator"></div>

  <header class="ldc-header">
    <div class="ldc-identity">
      <h3 class="ldc-name">{{ dan }}</h3>
      <div class="ldc-badges">
        <span class="ldc-badge date">{{ datum }}</span>
      </div>
    </div>

    <div class="ldc-actions">
      <div class="ldc-service-pill">
        <span class="pill-label">SLUŽBA</span>
        <span class="pill-value">{{ brojSluzbe }}</span>
        <button
          type="button"
          tabindex="0"
          class="info-trigger"
          *ngIf="!brojSluzbe.includes('P')"
          [appPopover]="
            '<b>Ukup. sati: </b>' +
            ukupSati +
            '<br><b>Efek. sati: </b>' +
            efekSati +
            '<br><b>Druga smjena: </b>' +
            drSmj +
            '<br><b>Noćni rad: </b>' +
            nocniRad
          "
        >
          i
        </button>
      </div>
    </div>
  </header>

  <div class="ldc-timeline">
    <div class="ldc-node">
      <span class="ldc-label">NASTUP</span>
      <span class="ldc-time">{{ vrijemePocetak }}</span>
      <span class="ldc-location">{{ nastup }}</span>
    </div>

    <div class="ldc-connector">
      <div class="ldc-route-info">
        <a
          *ngIf="linija"
          [href]="
            'https://triglav.bezdomni.net/public_transport/zet/routes/' + linija
          "
          target="_blank"
          class="route-link"
        >
          <span class="route-num">
            {{ linija }}
            <svg
              class="route-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="6" cy="19" r="3"></circle>
              <circle cx="18" cy="5" r="3"></circle>
              <path
                d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"
              ></path>
            </svg>
          </span>
        </a>
        <span class="vr-num">V.R. {{ vr }}</span>
      </div>
      <div class="ldc-line-path"></div>
    </div>

    <div class="ldc-node text-right">
      <span class="ldc-label">ZAVRŠETAK</span>
      <span class="ldc-time">{{ vrijemeKraj }}</span>
      <span class="ldc-location">{{ zavrsetak }}</span>
    </div>
  </div>
</div>
