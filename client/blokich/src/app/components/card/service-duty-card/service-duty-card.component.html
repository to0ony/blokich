<div class="sdc-card">
  <header class="sdc-header">
    <div class="sdc-date-group">
      <span class="sdc-day-label">{{ getDayName(day.dan) | uppercase }}</span>
      <h2 class="sdc-date-display">{{ formatDate(day.datum) }}</h2>
    </div>
  </header>

  <div class="sdc-drivers" *ngIf="day.vozaci.length > 0">
    <div class="sdc-driver-row" *ngFor="let vozac of day.vozaci">
      <div class="sdc-driver-info">
        <div class="sdc-name-row">
          <span class="sdc-driver-name">{{ vozac.ime_prezime }}</span>
        </div>
        <span class="sdc-driver-id">{{ vozac.sluz_broj }}</span>
      </div>

      <div class="sdc-actions">
        <a
          *ngIf="vozac.kontakt_broj"
          [href]="'tel:' + vozac.kontakt_broj"
          class="sdc-call-button"
          aria-label="Poziv"
        >
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
            />
          </svg>
        </a>
      </div>
    </div>
  </div>
</div>
