<div class="driver-shift-wrapper">
  <div *ngIf="isLoading" class="text-center py-3">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Učitavanje...</span>
    </div>
  </div>

  <div *ngIf="!isLoading && voznje.length > 0">
    <div class="voznje-list">
      <app-line-duty-card *ngFor="let vozac of voznje" [vozac]="vozac" />
    </div>
  </div>

  <div *ngIf="!isLoading && voznje.length === 0" class="text-muted">
    Nema dostupnih vožnji za današnje linije.
  </div>
</div>
