<div class="apple-container">
  <header class="apple-header">
    <h1 class="apple-title">Pregled linija</h1>
    <p class="apple-subtitle">Pronađite raspored vozača za određenu liniju</p>
  </header>

  <div class="apple-filter-card">
    <div class="segmented-control">
      <input
        type="radio"
        id="trenutni"
        name="tjedan"
        value="trenutni"
        [(ngModel)]="odabraniTjedan"
      />
      <label for="trenutni">Aktualni tjedan</label>

      <input
        type="radio"
        id="naredni"
        name="tjedan"
        value="naredni"
        [(ngModel)]="odabraniTjedan"
        [disabled]="!isNextWeekAvailable"
      />
      <label for="naredni" [class.is-disabled]="!isNextWeekAvailable">
        Naredni tjedan
      </label>

      <div class="selection-bg"></div>
    </div>

    <div class="input-grid">
      <div class="apple-input-group">
        <label>Broj linije</label>
        <input
          type="text"
          [(ngModel)]="odabranaLinija"
          placeholder="npr. 102"
          class="apple-input"
        />
      </div>

      <div class="apple-input-group">
        <label>Dan u tjednu</label>
        <div class="select-wrapper">
          <select [(ngModel)]="odabraniDan" class="apple-select">
            <option value="" disabled selected>Odaberi dan</option>
            <option *ngFor="let d of dani" [value]="d.key">
              {{ d.label }}
            </option>
          </select>
        </div>
      </div>
    </div>

    <button
      class="apple-btn-main"
      (click)="fetchScheduleData()"
      [disabled]="!odabranaLinija || !odabraniDan || isLoading"
    >
      <span *ngIf="!isLoading">Dohvati raspored</span>
      <div *ngIf="isLoading" class="apple-spinner"></div>
    </button>
  </div>

  <div class="results-area" *ngIf="voze?.length && !isLoading">
    <div class="results-header">
      <div class="title-wrap">
        <span class="line-badge">{{ linija }}</span>
        <h2>{{ dan }}</h2>
      </div>
    </div>

    <div class="duty-stack">
      <app-line-duty-card *ngFor="let vozac of voze" [vozac]="vozac" />
    </div>
  </div>

  <div
    *ngIf="isSearched && !isLoading && !voze?.length"
    class="apple-empty-state"
  >
    <div class="empty-icon">🔍</div>
    <p>Nema pronađenih vožnji za traženu kombinaciju.</p>
  </div>
</div>
