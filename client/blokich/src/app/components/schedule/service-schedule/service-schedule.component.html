<div class="apple-container">
  <header class="apple-header">
    <h1 class="apple-title">Pregled službe</h1>
    <p class="apple-subtitle">Raspored vozača po službi</p>
  </header>

  <div class="apple-filter-card">
    <div class="segmented-control">
      <input
        type="radio"
        id="trenutni"
        name="tjedan"
        value="trenutni"
        [(ngModel)]="odabraniTjedan"
      />
      <label for="trenutni">Aktualni tjedan</label>

      <input
        type="radio"
        id="naredni"
        name="tjedan"
        value="naredni"
        [(ngModel)]="odabraniTjedan"
        [disabled]="!isNextWeekAvailable"
      />
      <label for="naredni" [class.is-disabled]="!isNextWeekAvailable">
        Naredni tjedan
      </label>

      <div class="selection-bg"></div>
    </div>

    <div class="input-grid">
      <div class="apple-input-group">
        <label>Broj službe</label>
        <input
          type="text"
          [(ngModel)]="odabranaSluzba"
          placeholder="npr. 308"
          class="apple-input"
        />
      </div>
    </div>

    <button
      class="apple-btn-main"
      (click)="fetchSchedule()"
      [disabled]="!odabranaSluzba || isLoading"
    >
      <span *ngIf="!isLoading">Dohvati raspored</span>
      <div *ngIf="isLoading" class="apple-spinner"></div>
    </button>
  </div>

  <div class="results-area" *ngIf="serviceData && !isLoading">
    <app-service-info-card [serviceData]="serviceData"></app-service-info-card>

    <div class="duty-stack">
      <app-service-duty-card
        *ngFor="let day of serviceData.raspored"
        [day]="day"
        [serviceInfo]="serviceData"
      >
      </app-service-duty-card>
    </div>
  </div>

  <div
    *ngIf="isSearched && !isLoading && !serviceData"
    class="apple-empty-state"
  >
    <div class="empty-icon">🔍</div>
    <p>Nema podataka za traženu službu.</p>
  </div>
</div>
