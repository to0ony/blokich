<div class="ldc-main-wrapper">
  <div class="ldc-main-container">
    <header class="ldc-view-header">
      <div class="ldc-segmented-control">
        <input
          type="radio"
          id="trenutni"
          name="tjedan"
          [checked]="tjedanAktivan === 'trenutni'"
          (change)="changeWeek('trenutni')"
        />
        <label for="trenutni">Aktualni tjedan</label>

        <input
          type="radio"
          id="naredni"
          name="tjedan"
          [checked]="tjedanAktivan === 'naredni'"
          (change)="changeWeek('naredni')"
          [disabled]="!naredniTjedanDostupan"
        />
        <label
          for="naredni"
          [ngClass]="{ 'is-disabled': !naredniTjedanDostupan }"
        >
          Naredni tjedan
          <span class="lock-icon" *ngIf="!naredniTjedanDostupan"></span>
        </label>

        <div class="selection-slider"></div>
      </div>

      <div class="ldc-week-info" *ngIf="prikazaniTjedan">
        <span class="week-label"
          >Raspored vožnji za {{ prikazaniTjedan }}. tjedan
          {{ prikazanaGodina }}. godine</span
        >
      </div>
    </header>

    <main class="ldc-timeline-list">
      <ng-container *ngFor="let dan of rasporedZaPrikaz">
        <ng-container *ngIf="!dan.isOff && dan.duties.length">
          <div class="ldc-item-wrapper" *ngFor="let duty of dan.duties">
            <app-on-duty-card
              [dan]="dan.dan"
              [datum]="dan.datum"
              [vrijemePocetak]="duty.od"
              [vrijemeKraj]="duty.do"
              [brojSluzbe]="duty.br_sl"
              [linija]="duty.linija"
              [ukupSati]="duty.ukupni_sati"
              [efekSati]="duty.efektivni_sati"
              [vr]="duty.varijanta"
              [nastup]="duty.nastup_sluzbe"
              [zavrsetak]="duty.zavrsna_sluzba"
              [id]="isToday(dan.datum) ? 'danasnja-kartica' : ''"
            ></app-on-duty-card>
          </div>
        </ng-container>

        <div class="ldc-item-wrapper" *ngIf="dan.isOff">
          <app-off-duty-card
            [dan]="dan.dan"
            [datum]="dan.datum"
            [oznaka]="dan.duties[0]?.odsustvo"
          ></app-off-duty-card>
        </div>
      </ng-container>
    </main>
  </div>
</div>
