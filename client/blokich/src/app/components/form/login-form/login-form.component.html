<div class="lg">
  <img src="assets/blokich_logo.png" alt="Blokich" class="lg-logo" />

  <!-- Zaključan uređaj: samo lozinka -->
  <form
    *ngIf="!otkljucano; else prijava"
    class="lg-card"
    (ngSubmit)="otkljucaj()"
  >
    <label class="vz-label" for="lozinka">Lozinka</label>
    <input
      pInputText
      type="password"
      id="lozinka"
      name="lozinka"
      placeholder="Unesi lozinku"
      autocomplete="current-password"
      enterkeyhint="go"
      autofocus
      class="lg-input"
      [class.ng-invalid]="lozinkaGreska"
      [class.ng-dirty]="lozinkaGreska"
      [(ngModel)]="lozinka"
      (input)="lozinkaGreska = ''"
    />
    <span class="lg-error" *ngIf="lozinkaGreska">
      <i class="pi pi-exclamation-circle"></i> {{ lozinkaGreska }}
    </span>

    <p-button
      type="submit"
      label="Nastavi"
      styleClass="lg-btn"
      [loading]="isLoading"
      [disabled]="!lozinka"
    />
  </form>

  <ng-template #prijava>
    <div class="lg-notice" *ngIf="isNextWeekAvailable">
      <i class="pi pi-calendar-plus"></i>
      <span>Objavljen je raspored za sljedeći tjedan.</span>
    </div>

    <form class="lg-card" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <label class="vz-label" for="sluzbeniBroj">Službeni broj</label>
      <input
        pInputText
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        enterkeyhint="go"
        autocomplete="off"
        id="sluzbeniBroj"
        formControlName="sluzbeniBroj"
        class="lg-input"
        (input)="loginGreska = ''"
        (blur)="ukloniVodeceNule()"
      />
      <span
        class="lg-error"
        *ngIf="
          loginForm.get('sluzbeniBroj')?.invalid &&
          loginForm.get('sluzbeniBroj')?.touched &&
          loginForm.get('sluzbeniBroj')?.value
        "
      >
        <i class="pi pi-exclamation-circle"></i> Upiši samo brojke.
      </span>
      <span class="lg-error" *ngIf="loginGreska">
        <i class="pi pi-exclamation-circle"></i> {{ loginGreska }}
      </span>

      <div class="lg-recent" *ngIf="recentNumbers.length">
        <span class="lg-recent-label">Nedavno</span>
        <span
          *ngFor="let num of recentNumbers"
          class="lg-chip"
          role="button"
          tabindex="0"
          (click)="selectRecentNumber(num)"
          (keyup.enter)="selectRecentNumber(num)"
        >
          {{ num }}
          <button
            type="button"
            class="lg-chip-x"
            (click)="removeRecentNumber($event, num)"
            aria-label="Ukloni broj"
          >
            <i class="pi pi-times"></i>
          </button>
        </span>
      </div>

      <p-button
        type="submit"
        label="Prijavi se"
        styleClass="lg-btn"
        [loading]="isLoading"
        [disabled]="loginForm.invalid"
      />
    </form>

    <!-- Dodatne opcije -->
    <a class="lg-map" routerLink="/karta">
      <span class="lg-map-dot"></span>
      <span class="lg-map-txt">
        <strong>Karta uživo</strong>
        <small>Gdje su sad busevi i tko vozi</small>
      </span>
      <i class="pi pi-map"></i>
    </a>

    <div class="lg-links">
      <a class="lg-link" routerLink="/linija">
        <i class="pi pi-directions"></i> Vozači linije
      </a>
      <a class="lg-link" routerLink="/sluzba">
        <i class="pi pi-users"></i> Vozači službe
      </a>
      <button
        type="button"
        class="lg-link"
        (click)="showSearchForm = true"
      >
        <i class="pi pi-search"></i> Pretraga vozača
      </button>
      <a class="lg-link" routerLink="/sluzbe">
        <i class="pi pi-list"></i> Popis službi
      </a>
      <a class="lg-link is-wide" routerLink="/linije">
        <i class="pi pi-share-alt"></i> Linije · trase i polasci
      </a>
      <a class="lg-link is-wide" routerLink="/vozni-park">
        <i class="pi pi-car"></i> Vozni park
      </a>
    </div>

    <!-- Pretraga vozača u donjem panelu -->
    <app-vozac-search-form
      [(visible)]="showSearchForm"
      (selectVozac)="onVozacSelected($event)"
    />
  </ng-template>

  <!-- Ponuda za instalaciju na početni zaslon (samo kad nije već instalirano) -->
  <app-instalacija />

  <a class="lg-admin" routerLink="/alogin">
    <i class="pi pi-lock"></i> Administracija
  </a>

  <p class="lg-verzija" *ngIf="verzija">Blokich {{ verzija }}</p>
</div>
