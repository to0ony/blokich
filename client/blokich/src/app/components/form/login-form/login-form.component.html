<div class="apple-login-container">
  <div class="apple-brand-header">
    <img
      src="../../../../assets/blokich_xmas_logo.png"
      alt="Blokich logo"
      class="apple-logo"
    />
  </div>

  <app-disponent-status
    *ngIf="isNextWeekAvailable"
    [show]="isNextWeekAvailable"
  ></app-disponent-status>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="apple-form">
    <div class="input-group-custom">
      <label for="sluzbeniBroj">Službeni broj vozača</label>
      <input
        type="number"
        id="sluzbeniBroj"
        formControlName="sluzbeniBroj"
        placeholder="Unesi broj"
        [class.has-error]="
          loginForm.get('sluzbeniBroj')?.invalid &&
          loginForm.get('sluzbeniBroj')?.touched
        "
      />
      <span
        class="error-text"
        *ngIf="
          loginForm.get('sluzbeniBroj')?.invalid &&
          loginForm.get('sluzbeniBroj')?.touched
        "
      >
        Obavezno polje.
      </span>
    </div>

    <div class="action-buttons">
      <button
        type="submit"
        class="apple-btn-primary"
        [disabled]="loginForm.invalid || isLoading"
      >
        <span *ngIf="!isLoading">Prijavi se</span>
        <div *ngIf="isLoading" class="apple-spinner"></div>
      </button>

      <button
        type="button"
        class="apple-btn-secondary"
        (click)="toggleSearchForm()"
      >
        Pretraga vozača
      </button>
    </div>
  </form>

  <div class="search-collapsible" [class.open]="showSearchForm">
    <app-vozac-search-form
      *ngIf="showSearchForm"
      (selectVozac)="onVozacSelected($event)"
    ></app-vozac-search-form>
  </div>
</div>
