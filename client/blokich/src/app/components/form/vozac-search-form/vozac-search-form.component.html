<section class="vs">
  <form class="vs-bar" (ngSubmit)="openSearch()">
    <input
      pInputText
      type="text"
      name="q"
      id="searchVozac"
      autocomplete="off"
      placeholder="Prezime, ime ili broj"
      class="vs-input"
      [(ngModel)]="searchQuery"
    />
    <p-button
      type="submit"
      icon="pi pi-search"
      ariaLabel="Traži"
      [disabled]="!searchQuery.trim()"
    />
  </form>

  <ng-container *ngIf="isModalVisible">
    <div class="vs-head">
      <span>Rezultati</span>
      <button type="button" class="vs-close" (click)="closeSearch()">Zatvori</button>
    </div>

    <div class="vs-list" *ngIf="searchResults.length; else nema">
      <button
        type="button"
        class="vs-item"
        *ngFor="let v of searchResults"
        (click)="onSelectVozac(v.sluz_broj)"
      >
        <span class="vs-avatar">{{ inicijali(v.ime_prezime) }}</span>
        <span class="vs-text">
          <span class="vs-name">{{ v.ime_prezime }}</span>
          <span class="vs-num">{{ v.sluz_broj }}</span>
        </span>
        <i class="pi pi-angle-right"></i>
      </button>
    </div>

    <ng-template #nema>
      <p class="vs-empty">Nema rezultata za „{{ searchQuery }}“.</p>
    </ng-template>
  </ng-container>
</section>
