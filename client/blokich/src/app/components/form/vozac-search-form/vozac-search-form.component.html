<p-drawer
  [visible]="visible"
  (visibleChange)="$event ? null : zatvori()"
  position="bottom"
  styleClass="rs-drawer vz-app vs-drawer"
  [blockScroll]="true"
  header="Pretraga vozača"
  (onShow)="naOtvaranje()"
  (onHide)="naZatvaranje()"
>
  <form class="vs-bar" (ngSubmit)="traziOdmah()">
    <i class="pi pi-search"></i>
    <input
      #polje
      pInputText
      type="search"
      name="q"
      autocomplete="off"
      enterkeyhint="search"
      placeholder="Prezime, ime ili službeni broj"
      class="vs-input"
      [(ngModel)]="searchQuery"
      (ngModelChange)="naUpis($event)"
    />
  </form>

  <!-- Prije upisa -->
  <p class="vs-hint" *ngIf="trazeno === null && !trazim">
    Upiši barem dva slova ili znamenke. Dodir na vozača upiše njegov broj u prijavu.
  </p>

  <div class="vs-list" *ngIf="trazim">
    <p-skeleton *ngFor="let i of [1, 2, 3]" height="58px" borderRadius="14px" />
  </div>

  <ng-container *ngIf="!trazim && trazeno !== null">
    <div class="vs-list" *ngIf="searchResults.length; else nema">
      <button
        type="button"
        class="vs-item"
        *ngFor="let v of searchResults"
        (click)="onSelectVozac(v.sluz_broj)"
      >
        <span class="vs-avatar">{{ inicijali(v.ime_prezime) }}</span>
        <span class="vs-text">
          <span class="vs-name">{{ v.ime_prezime }}</span>
          <span class="vs-num">{{ v.sluz_broj }}</span>
        </span>
        <i class="pi pi-angle-right"></i>
      </button>
    </div>

    <ng-template #nema>
      <p class="vs-empty">Nema vozača za „{{ trazeno }}“.</p>
    </ng-template>
  </ng-container>
</p-drawer>
