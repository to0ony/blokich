<div class="apple-admin-card">
  <div class="apple-brand-header">
    <h2 class="apple-title">Blokich Admin</h2>
  </div>

  <form (ngSubmit)="login()" class="apple-form">
    <div class="input-group-custom">
      <label for="username">Korisničko ime</label>
      <div class="input-wrapper">
        <input
          id="username"
          [(ngModel)]="username"
          name="username"
          type="text"
          required
        />
      </div>
    </div>

    <div class="input-group-custom">
      <label for="password">Lozinka</label>
      <div class="input-wrapper">
        <input
          id="password"
          [(ngModel)]="password"
          name="password"
          type="password"
          required
        />
      </div>
    </div>

    <button type="submit" class="apple-btn-primary">Prijavi se</button>

    <div *ngIf="error" class="apple-error-box">
      <span>{{ error }}</span>
    </div>
  </form>
</div>
