<div class="al">
  <div class="al-brand">
    <img src="assets/blokich_logo.png" alt="Blokich" class="al-logo" />
    <span class="al-badge"><i class="pi pi-lock"></i> Administracija</span>
  </div>

  <form class="al-card" (ngSubmit)="login()">
    <label class="vz-label" for="username">Korisničko ime</label>
    <input
      pInputText
      id="username"
      name="username"
      type="text"
      autocomplete="username"
      autocapitalize="off"
      class="al-input"
      required
      [(ngModel)]="username"
      (input)="error = ''"
    />

    <label class="vz-label al-gap" for="password">Lozinka</label>
    <input
      pInputText
      id="password"
      name="password"
      type="password"
      autocomplete="current-password"
      class="al-input"
      required
      [(ngModel)]="password"
      (input)="error = ''"
    />

    <span class="al-error" *ngIf="error">
      <i class="pi pi-exclamation-circle"></i> {{ error }}
    </span>

    <p-button
      type="submit"
      label="Prijavi se"
      styleClass="al-btn"
      [loading]="loading"
      [disabled]="!username || !password"
    />
  </form>

  <a class="al-back" routerLink="/login">
    <i class="pi pi-arrow-left"></i> Prijava vozača
  </a>
</div>
