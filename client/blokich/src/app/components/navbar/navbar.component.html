<nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top px-3">
  <a class="navbar-brand me-3" href="dashboard">
    <img src="assets/blokich_logo.png" alt="Blokich" height="30" />
  </a>

  <!-- Hamburger toggler -->
  <button
    class="navbar-toggler"
    type="button"
    data-bs-toggle="collapse"
    data-bs-target="#navbarNav"
    aria-controls="navbarNav"
    aria-expanded="false"
    aria-label="Toggle navigation"
  >
    <span class="navbar-toggler-icon"></span>
  </button>

  <!-- Collapse area -->
  <div class="collapse navbar-collapse" id="navbarNav">
    <!-- Lijeva strana navigacije -->
    <div
      class="d-flex flex-column flex-lg-row align-items-center gap-2 w-100 justify-content-between py-3 py-lg-0"
    >
      <div class="d-flex flex-column flex-lg-row gap-2 align-items-center">
        <button
          class="nav-btn"
          [class.active]="view === 'raspored'"
          (click)="switchView.emit('raspored')"
        >
          Raspored vožnje
        </button>

        <button
          class="nav-btn"
          [disabled]="!isDrivingToday"
          [class.active]="view === 'smjena'"
          (click)="switchView.emit('smjena')"
        >
          Današnja smjena
        </button>

        <button
          class="nav-btn"
          [class.active]="view === 'vozaci'"
          (click)="switchView.emit('vozaci')"
        >
          Vozači po liniji
        </button>
      </div>

      <!-- Desna strana (logout) -->
      <div class="d-flex align-items-center gap-3 pt-2 pt-lg-0 ps-lg-4">
        <div class="d-flex flex-column">
          <span class="driver-name"
            >Vozač: <strong>{{ imePrezime }}</strong></span
          >
          <span class="driver-name"
            >Službeni broj: <strong>{{ sluzbeniBroj }}</strong></span
          >
        </div>

        <button class="nav-btn danger-btn" (click)="logout()">Odjava</button>
      </div>
    </div>
  </div>
</nav>
