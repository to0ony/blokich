<nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top px-3">
  <a class="navbar-brand me-3" href="dashboard">
    <img src="assets/blokich_logo.png" alt="Blokich" height="30" />
  </a>

  <button
    class="navbar-toggler"
    type="button"
    data-bs-toggle="collapse"
    data-bs-target="#navbarNav"
    aria-controls="navbarNav"
    aria-expanded="false"
    aria-label="Toggle navigation"
  >
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="navbarNav">
    <!-- VOZAČ -->
    <div
      *ngIf="role === 'vozac'"
      class="d-flex flex-column flex-lg-row w-100 align-items-center justify-content-between py-3 py-lg-0"
    >
      <div
        class="order-1 order-lg-1 d-flex flex-column flex-lg-row gap-2 align-items-center me-lg-auto"
      >
        <button
          class="nav-btn"
          [class.active]="view === 'raspored'"
          (click)="switchView.emit('raspored')"
        >
          Raspored vožnje
        </button>

        <button
          class="nav-btn"
          [disabled]="!isDrivingToday"
          [class.active]="view === 'smjena'"
          (click)="switchView.emit('smjena')"
        >
          Današnja smjena
        </button>

        <button
          class="nav-btn"
          [class.active]="view === 'vozaci'"
          (click)="switchView.emit('vozaci')"
        >
          Vozači po liniji
        </button>
      </div>

      <div
        class="order-2 order-lg-2 d-flex align-items-center gap-3 pt-2 pt-lg-0 mt-4 mt-lg-0"
      >
        <div class="d-flex flex-column">
          <span class="driver-name">
            Vozač: <strong>{{ imePrezime }}</strong>
          </span>
          <span class="driver-name">
            Službeni broj: <strong>{{ sluzbeniBroj }}</strong>
          </span>
          <span class="driver-name">
            Kontakt:
            <strong>
              {{ kontaktBroj }}
              <ng-container *ngIf="kontaktBrojInfo">
                | {{ kontaktBrojInfo }}
              </ng-container>
            </strong>
          </span>
        </div>
        <button class="nav-btn danger-btn" (click)="logout()">Odjava</button>
      </div>
    </div>

    <!-- ADMIN -->
    <div
      *ngIf="role === 'admin'"
      class="w-100 d-flex justify-content-center justify-content-lg-end align-items-center py-3 py-lg-0"
    >
      <button class="nav-btn danger-btn" (click)="logout()">Odjava</button>
    </div>
  </div>
</nav>
