<div class="apple-upload-container">
  <div class="file-picker-zone">
    <div class="input-stack">
      <label for="pdfUpload" class="file-label">
        <div class="upload-icon">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
            ></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="12" y1="18" x2="12" y2="12"></line>
            <polyline points="9 15 12 12 15 15"></polyline>
          </svg>
        </div>
        <span class="label-text">Odaberi PDF dokument službi</span>
        <input
          type="file"
          id="pdfUpload"
          accept=".pdf"
          (change)="onFileSelected($event)"
          class="hidden-input"
        />
      </label>

      <div class="selected-file-name" *ngIf="selectedFile">
        {{ selectedFile.name }}
      </div>
    </div>

    <button
      class="apple-action-btn"
      [disabled]="loading || !selectedFile"
      (click)="upload()"
    >
      <span *ngIf="!loading">Pošalji datoteku</span>
      <div *ngIf="loading" class="apple-spinner-small"></div>
    </button>
  </div>

  <div
    class="status-toast"
    *ngIf="uploadStatus"
    [ngClass]="{
      success: uploadStatus.includes('Uspješno'),
      error: uploadStatus.includes('greške'),
    }"
  >
    <span class="dot"></span>
    {{ uploadStatus }}
  </div>

  <div class="history-section" *ngIf="lastUploadInfo">
    <h3 class="section-title">Informacije o zadnjem uvozu</h3>
    <div class="apple-data-list">
      <div class="data-row">
        <span class="data-label">Datum unosa</span>
        <span class="data-value">{{
          lastUploadInfo.datum_unosa | date: "dd.MM.yyyy HH:mm"
        }}</span>
      </div>
      <div class="data-row">
        <span class="data-label">Broj ubačenih</span>
        <span class="data-value highlight">{{
          lastUploadInfo.broj_ubacenih
        }}</span>
      </div>
      <div class="data-row" *ngIf="lastUploadInfo.original_filename">
        <span class="data-label">Datoteka</span>
        <span class="data-value filename">{{
          lastUploadInfo.original_filename
        }}</span>
      </div>
    </div>
  </div>
</div>
