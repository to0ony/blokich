<p-dialog
  [visible]="vidljivo"
  (visibleChange)="!$event && zatvori()"
  [modal]="true"
  [maximizable]="true"
  [dismissableMask]="true"
  [draggable]="false"
  [style]="{ width: '1180px' }"
  [breakpoints]="{ '1240px': '96vw', '640px': '100vw' }"
  styleClass="sp-dialog"
>
  <ng-template #header>
    <div class="spd-head">
      <span class="spd-eyebrow">Povijest službi</span>
      <h3>Službe v{{ verzija }}</h3>
      @if (povijest) {
        <span class="spd-meta">
          Uneseno {{ povijest.datum_unosa | date: "d.M.yyyy. 'u' HH:mm" }}
          @if (povijest.original_filename) {
            · {{ povijest.original_filename }}
          }
        </span>
      }
    </div>
  </ng-template>

  @if (ucitava) {
    <p-skeleton height="2.2rem" styleClass="mb-2" />
    <p-skeleton height="18rem" />
  } @else if (greska) {
    <p class="spd-error">
      <i class="pi pi-exclamation-triangle"></i> {{ greska }}
    </p>
  } @else {
    <app-sluzbe-popis [zapisi]="zapisi" [tjedni]="povijest?.tjedni ?? null" />
  }
</p-dialog>
