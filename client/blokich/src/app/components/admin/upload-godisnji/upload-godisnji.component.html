<div class="apple-upload-container is-disabled">
  <div class="disabled-overlay">
    <div class="lock-icon">
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
      >
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>
    <span>Modul trenutno nedostupan</span>
  </div>

  <div class="file-picker-zone">
    <div class="input-stack">
      <label class="file-label">
        <div class="upload-icon">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#86868b"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
          </svg>
        </div>
        <span class="label-text">Odaberi PDF godišnjih odmora</span>
        <input type="file" [disabled]="true" class="hidden-input" />
      </label>
    </div>

    <button class="apple-action-btn" [disabled]="true">Učitaj</button>
  </div>
</div>
